<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notes Toward a Deck</title>

  <!-- Fonts loaded as real <link> tags, not @import, so they load faster -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />

  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #191521; }
    #root { min-height: 100vh; }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- React + ReactDOM (production builds) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- Babel standalone: compiles the JSX in app.js in the browser.
       This keeps the site dependency-free and buildless — no npm
       install, no bundler, just static files GitHub Pages can serve
       directly. -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Storage shim: must load before app.js -->
  <script src="storage.js"></script>

  <!-- The app itself -->
  <script type="text/babel" src="app.js"></script>
</body>
</html>
